name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Stage distributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path @(
            "target/release/uma-downloader.exe",
            "target/release/sqlite3mc_x64.dll",
            "target/release/uma_index_meta.py",
            "README.md",
            "LICENSE"
          ) -Destination dist/

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: uma-downloader-windows
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/uma-downloader.exe
            dist/sqlite3mc_x64.dll
            dist/uma_index_meta.py

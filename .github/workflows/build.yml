name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Stage distributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Path @(
            "target/release/uma-downloader.exe",
            "target/release/sqlite3mc_x64.dll",
            "target/release/uma_index_meta.py",
            "README.md",
            "LICENSE"
          ) -Destination dist/

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: uma-downloader-windows
          path: dist/

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath uma-downloader-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the release so a re-tagged version replaces stale assets.
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
          gh release create "$GITHUB_REF_NAME" uma-downloader-windows.zip --generate-notes

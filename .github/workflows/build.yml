name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: uma-downloader-windows
          path: |
            target/release/uma-downloader.exe
            target/release/sqlite3mc_x64.dll
            target/release/uma_index_meta.py
            README.md
            LICENSE

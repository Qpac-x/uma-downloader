[package]
name = "uma-downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
eframe = "0.31"
futures = "0.3"
indicatif = "0.17"
libloading = "0.8"
lz4_flex = { version = "0.11", features = ["frame"] }
reqwest = { version = "0.12", features = ["stream"] }
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
